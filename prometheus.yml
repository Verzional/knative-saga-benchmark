global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'knative-metrics'
    scrape_interval: 2s
    static_configs:
      - targets: ['192.168.10.10:9090']
        labels:
          node: 'legion-sut'
          environment: 'serverless-kind'

  - job_name: 'legion-cadvisor'
    scrape_interval: 2s
    static_configs:
      - targets: ['192.168.10.10:8080']
        labels:
          node: 'legion-sut'

  - job_name: 'agent-bridge'
    scrape_interval: 5s
    static_configs:
      - targets: ['127.0.0.1:8088', '192.168.10.10:8088']
