# Live Nov 23, 2026 (-00003) Knative revision specs verified on cluster.
# Note: Neither -00003 nor Temporal -00002 applied maxScale or GOMEMLIMIT; unlike Temporal
# -00002 (50m/500m CPU, 64Mi/256Mi RAM), -00003 Kafka revisions ran with resources: {}.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: order
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/scaleToZeroGracePeriod: "30s"
    spec:
      containerConcurrency: 0
      containers:
        - image: kind.local/saga-kafka-order:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKERS
              value: "saga-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
          resources: {}
---
