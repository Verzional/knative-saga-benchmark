apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: order
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/scaleToZeroGracePeriod: "30s"
    spec:
      containers:
        - image: saga-kafka-order:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKERS
              value: "saga-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: PORT
              value: "8080"
            - name: GOMEMLIMIT
              value: "220MiB"
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
