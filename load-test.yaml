config:
  target: "http://order.default.192.168.10.10.nip.io"
  phases:
    - duration: 60
      arrivalRate: 10
      rampTo: 100
      name: "Warm up and Scale"

scenarios:
  - name: "Create Order Transaction"
    flow:
      - post:
          url: "/orders"
          json:
            order_id: "order-{{ $uuid }}"
            amount: 150.00
